<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tienda Streaming</title>

<!-- 🔵 FAVICON (icono pestaña) -->
<link rel="icon" href="https://i.ibb.co/XktQXtDC/RDCOMPANY3.png" type="image/png">

<!-- 🔵 ICONO AL COMPARTIR (WhatsApp / redes) -->
<meta property="og:image" content="https://i.ibb.co/XktQXtDC/RDCOMPANY3.png">
<meta property="og:title" content="Tienda Streaming">
<meta property="og:description" content="Servicios de streaming al mejor precio">

</head>

<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>

<body>

<header class="header">
  <div class="header-content">
    <img src="https://i.ibb.co/XktQXtDC/RDCOMPANY3.png" class="logo">
    <h2>R.D COMPANY Tienda Streaming</h2>
  </div>
</header>

<!-- PROMO -->
<div class="promo">
🔥 PROMO HOY - ACTIVACIÓN INMEDIATA 🔥
</div>

<!-- BUSCADOR -->
<div class="buscador">
  <input type="text" id="buscadorInput" placeholder="🔍 Buscar servicio...">
</div>

<!-- BOTON CARRITO -->
<div class="btn-carrito" onclick="toggleCarrito()">
  🛒 <span id="contador">0</span>
</div>

<!-- WHATSAPP -->
<a href="https://wa.me/543735549919" target="_blank" class="whatsapp-btn">
  <img src="https://cdn3.emoji.gg/emojis/7578-whatsapp.png" alt="WhatsApp">
</a>

<!-- FAKE ACTIVIDAD -->
<div id="actividad" class="actividad"></div>

<div class="container">
  <div class="grid" id="productos"></div>
</div>

<!-- MODAL -->
<div id="modalCarrito" class="modal">
  <div class="modal-content">

    <h3>🧾 Tu Pedido</h3>

    <div id="listaCarrito"></div>
    <h3 id="total"></h3>

    <div class="form-group">
      <input id="nombre" placeholder="Nombre">
      <input id="apellido" placeholder="Apellido">
      <input id="whatsapp" placeholder="WhatsApp +54...">
      <input id="email" placeholder="Email (opcional)">
    </div>

    <button class="btn" onclick="confirmarPedido()">Confirmar Pedido</button>
    <button class="btn" onclick="toggleCarrito()">Cerrar</button>

  </div>
</div>

<div id="toast" class="toast">Producto agregado</div>

<script src="app.js"></script>

</body>
</html>
